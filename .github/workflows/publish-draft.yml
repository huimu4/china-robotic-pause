name: Scheduled Publish

# Merge scheduled content from the drafts branch into main.
# GitHub Pages deploys from main, so drafts is never visible until release.
# cron fields: minute hour day month weekday (UTC).
# "0 4 * * *" = every day 04:00 UTC = 12:00 Beijing.
# The job only publishes when drafts has content newer than main,
# so daily runs are no-ops unless content is staged in drafts.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull scheduled content from drafts branch
        run: |
          git config user.name "robotichina-bot"
          git config user.email "bot@robotichina.com"
          git checkout main
          git checkout origin/drafts -- . || git checkout drafts -- .

      - name: Commit and push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Scheduled publish: release drafts content (auto)"
            git push origin main
            echo "published"
          else
            echo "no changes"
          fi
