name: Scheduled Publish

# DISABLED auto-schedule (was "0 4 * * *"): the old drafts-branch merge copied
# an entire stale drafts snapshot over main, which rolled back search-index /
# sitemap / llms entries and the og:image fix on every run (see commit 36223ca).
# Publishing is now manual (local push to main). This workflow stays only for
# manual on-demand runs via the "Run workflow" button on the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish only NEW html files from drafts branch
        run: |
          git config user.name "robotichina-bot"
          git config user.email "bot@robotichina.com"
          git fetch origin drafts
          # Copy over only article html files that exist on drafts but not on main.
          # Index files (articles.html, sitemap.xml, llms.txt, js/*) are NEVER
          # overwritten by drafts — they are maintained manually on main.
          NEW_FILES=$(git diff --diff-filter=A --name-only origin/drafts origin/main -- '*.html' || true)
          if [ -n "$NEW_FILES" ]; then
            for f in $NEW_FILES; do
              git checkout origin/drafts -- "$f"
            done
          fi

      - name: Commit and push new articles
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Scheduled publish: release drafts content (auto)"
            git push origin main
            echo "published"
          else
            echo "no changes"
          fi
